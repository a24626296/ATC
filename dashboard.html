<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台灣空域緊急代碼監控</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #060a09;
    --panel: #0c1614;
    --panel-line: #163028;
    --radar-green: #33ff99;
    --radar-green-dim: #1c8f5c;
    --amber: #ffb020;
    --alert-red: #ff3b52;
    --text: #d9ece5;
    --text-dim: #6f8b83;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    height: 100vh;
    overflow: hidden;
  }

  .app {
    display: grid;
    grid-template-rows: auto 1fr;
    height: 100vh;
  }

  /* ---- Top bar ---- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 22px;
    border-bottom: 1px solid var(--panel-line);
    background: linear-gradient(180deg, #0a1210, #060a09);
  }

  .topbar .title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--radar-green);
  }

  .title .sub {
    display: block;
    font-family: 'Inter', sans-serif;
    text-transform: none;
    letter-spacing: normal;
    color: var(--text-dim);
    font-size: 12px;
    margin-top: 2px;
  }

  .status-cluster {
    display: flex;
    gap: 26px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
  }

  .status-cluster .value {
    color: var(--radar-green);
    font-size: 15px;
    display: block;
  }

  .status-cluster .label {
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-size: 10px;
  }

  .status-cluster .alert-count.has-alert .value {
    color: var(--alert-red);
    animation: pulse-text 1.2s infinite;
  }

  /* ---- Layout ---- */
  .main {
    display: grid;
    grid-template-columns: 1fr 340px;
    height: 100%;
    min-height: 0;
  }

  .map-wrap {
    position: relative;
    min-height: 0;
  }

  #map {
    width: 100%;
    height: 100%;
    background: var(--bg);
  }

  /* radar sweep overlay */
  .sweep-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 450;
    overflow: hidden;
  }

  .sweep {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 220vmax;
    height: 220vmax;
    margin-top: -110vmax;
    margin-left: -110vmax;
    background: conic-gradient(from 0deg, rgba(51,255,153,0.16), rgba(51,255,153,0) 26%);
    animation: spin 5s linear infinite;
    mix-blend-mode: screen;
  }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse-text { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

  /* ---- Sidebar ---- */
  .sidebar {
    border-left: 1px solid var(--panel-line);
    background: var(--panel);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .sidebar h2 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
    padding: 16px 18px 8px;
    margin: 0;
  }

  .alert-list {
    overflow-y: auto;
    flex: 1;
    padding: 0 12px 12px;
  }

  .alert-card {
    border: 1px solid var(--alert-red);
    background: rgba(255,59,82,0.08);
    border-radius: 6px;
    padding: 12px 14px;
    margin-bottom: 10px;
    animation: pulse-border 1.6s infinite;
  }

  @keyframes pulse-border {
    0%,100% { box-shadow: 0 0 0 rgba(255,59,82,0); }
    50% { box-shadow: 0 0 14px rgba(255,59,82,0.45); }
  }

  .alert-card .callsign {
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    color: #fff;
  }

  .alert-card .code {
    display: inline-block;
    margin-top: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--alert-red);
    background: rgba(255,59,82,0.15);
    padding: 2px 6px;
    border-radius: 3px;
  }

  .alert-card .meta {
    margin-top: 6px;
    font-size: 11px;
    color: var(--text-dim);
    line-height: 1.5;
  }

  .empty-state {
    padding: 18px;
    color: var(--text-dim);
    font-size: 13px;
    line-height: 1.6;
  }

  .empty-state .glyph {
    color: var(--radar-green-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    display: block;
    margin-bottom: 6px;
  }

  .sidebar-tabs {
    display: flex;
    border-bottom: 1px solid var(--panel-line);
  }

  .sidebar-tab {
    flex: 1;
    background: none;
    border: none;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 14px 8px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }

  .sidebar-tab.active {
    color: var(--radar-green);
    border-bottom-color: var(--radar-green);
  }

  .sidebar-tab .count {
    margin-left: 4px;
    color: inherit;
    opacity: 0.7;
  }

  .history-card {
    position: relative;
    border: 1px solid var(--panel-line);
    background: rgba(255,255,255,0.02);
    border-radius: 6px;
    padding: 10px 32px 10px 12px;
    margin-bottom: 8px;
  }

  .delete-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 20px;
    height: 20px;
    border-radius: 4px;
    border: 1px solid transparent;
    background: none;
    color: var(--text-dim);
    font-size: 12px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .delete-btn:hover {
    color: var(--alert-red);
    border-color: var(--alert-red);
    background: rgba(255,59,82,0.08);
  }

  .history-card .callsign {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text);
  }

  .history-card .code {
    display: inline-block;
    margin-top: 3px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--amber);
    background: rgba(255,176,32,0.12);
    padding: 1px 5px;
    border-radius: 3px;
  }

  .history-card .meta {
    margin-top: 5px;
    font-size: 10px;
    color: var(--text-dim);
    line-height: 1.5;
  }

  .panel { display: none; }
  .panel.active { display: block; }

  .airline-legend {
    padding: 12px 18px 16px;
    border-top: 1px solid var(--panel-line);
    font-size: 10px;
    color: var(--text-dim);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px 12px;
  }

  .airline-legend .row { display: flex; align-items: center; gap: 6px; }
  .airline-legend .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  /* Leaflet dark tweaks */
  .leaflet-container { background: var(--bg); }
  .leaflet-control-attribution {
    background: rgba(6,10,9,0.7) !important;
    color: var(--text-dim) !important;
  }
  .leaflet-control-attribution a { color: var(--radar-green-dim) !important; }

  /* ---- Windy toggle ---- */
  .windy-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  .windy-switch {
    position: relative;
    width: 40px;
    height: 20px;
    border-radius: 10px;
    background: rgba(255,255,255,0.08);
    border: 1px solid var(--panel-line);
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.2s;
  }

  .windy-switch::after {
    content: '';
    position: absolute;
    top: 1px;
    left: 1px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--text-dim);
    transition: transform 0.2s, background 0.2s;
  }

  .windy-switch.on {
    background: rgba(51,255,153,0.18);
    border-color: var(--radar-green-dim);
  }

  .windy-switch.on::after {
    transform: translateX(20px);
    background: var(--radar-green);
    box-shadow: 0 0 6px var(--radar-green);
  }

  .windy-overlay {
    position: absolute;
    inset: 0;
    z-index: 500;
    display: none;
  }

  .windy-overlay.active { display: block; }

  .windy-overlay iframe {
    width: 100%;
    height: 100%;
    border: none;
  }
  .refresh-btn {
    background: none;
    border: 1px solid var(--panel-line);
    border-radius: 4px;
    color: var(--radar-green);
    width: 22px;
    height: 22px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    margin-left: 8px;
    padding: 0;
    vertical-align: middle;
    transition: border-color 0.15s;
  }

  .refresh-btn:hover { border-color: var(--radar-green-dim); }

  .refresh-btn svg {
    width: 12px;
    height: 12px;
    transition: transform 0.5s;
  }

  .refresh-btn.spinning svg {
    animation: spin-once 0.6s linear;
  }

  @keyframes spin-once { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="title">
      台灣空域監控 · SQUAWK WATCH
      <span class="sub">資料來源 OpenSky Network · 每 <span id="pollSec">30</span> 秒更新</span>
    </div>
    <div class="status-cluster">
      <div class="windy-toggle">
        <span>Windy</span>
        <div class="windy-switch" id="windySwitch" onclick="toggleWindy()"></div>
      </div>
      <div>
        <span class="value" id="lastUpdate">--:--:--</span>
        <span class="label">
          最後更新 (本地時間)
          <button class="refresh-btn" id="refreshBtn" onclick="forceRefresh()" title="立即強制更新">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <path d="M21 12a9 9 0 1 1-3-6.7"/>
              <path d="M21 3v6h-6"/>
            </svg>
          </button>
        </span>
      </div>
      <div>
        <span class="value" id="aircraftCount">0</span>
        <span class="label">空域內航機</span>
      </div>
      <div class="alert-count" id="alertCluster">
        <span class="value" id="alertCount">0</span>
        <span class="label">緊急事件</span>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="map-wrap">
      <div id="map"></div>
      <div class="sweep-overlay"><div class="sweep"></div></div>
      <div class="windy-overlay" id="windyOverlay">
        <iframe id="windyFrame" title="Windy 風場圖層" loading="lazy"></iframe>
      </div>
    </div>

    <div class="sidebar">
      <div class="sidebar-tabs">
        <button class="sidebar-tab active" id="tabActive" onclick="switchTab('active')">
          Active Alerts <span class="count" id="tabActiveCount">(0)</span>
        </button>
        <button class="sidebar-tab" id="tabHistory" onclick="switchTab('history')">
          History <span class="count" id="tabHistoryCount">(0)</span>
        </button>
      </div>

      <div class="alert-list panel active" id="panelActive">
        <div class="empty-state">
          <span class="glyph">◎</span>
          目前空域內無緊急代碼事件。<br>
          偵測到 squawk 7500 / 7600 / 7700 時會即時顯示於此，並透過 Telegram 推播。
        </div>
      </div>

      <div class="alert-list panel" id="panelHistory">
        <div class="empty-state">
          <span class="glyph">◎</span>
          自系統啟動以來，尚無緊急代碼歷史紀錄。
        </div>
      </div>

      <div class="airline-legend">
        <div class="row"><span class="dot" style="background:#ff6fae"></span>華航 CAL</div>
        <div class="row"><span class="dot" style="background:#ffffff;box-shadow:0 0 0 2px #2ecc71 inset"></span>長榮 EVA</div>
        <div class="row"><span class="dot" style="background:#4aa3ff"></span>華信 MDA</div>
        <div class="row"><span class="dot" style="background:#ffd43b"></span>虎航 TTW</div>
        <div class="row"><span class="dot" style="background:#c7ccd1"></span>星宇 SJX</div>
        <div class="row"><span class="dot" style="background:#8a5a3b"></span>德安 DAC</div>
        <div class="row"><span class="dot" style="background:#ffffff;box-shadow:0 0 0 1px #6f8b83 inset"></span>立榮 UIA</div>
        <div class="row"><span class="dot" style="background:#ffe066"></span>安捷 APX</div>
        <div class="row"><span class="dot" style="background:var(--radar-green-dim)"></span>其他航機</div>
        <div class="row"><span class="dot" style="background:var(--alert-red)"></span>緊急代碼</div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
  // ---- 設定：state.json 的位置 ----
  // 若跟 taiwan_squawk_monitor.py 產生的 state.json 放在同一個目錄下，保持 'state.json' 即可。
  // 若改成部署在 GitHub Pages + 另外用排程更新 state.json，可以改成完整 URL，
  // 例如 'https://raw.githubusercontent.com/<user>/<repo>/main/state.json'
  const STATE_URL = 'https://raw.githubusercontent.com/a24626296/ATC/main/state.json';
  const REFRESH_MS = 60000;  // 每分鐘讀一次 state.json 就好，後端本身是 4 分鐘更新一次
  document.getElementById('pollSec').textContent = REFRESH_MS / 1000;

  const SQUAWK_MEANING = {
    '7500': '劫機 Hijack',
    '7600': '通訊/無線電失效 Radio Failure',
    '7700': '一般緊急 General Emergency',
  };

  // 依 ICAO 呼號前綴對應航空公司顏色。white 系需要邊框才能在深色地圖上看得清楚。
  const AIRLINE_COLORS = {
    CAL: { fill: '#ff6fae', name: '華航' },
    EVA: { fill: '#ffffff', ring: '#2ecc71', name: '長榮' },
    MDA: { fill: '#4aa3ff', name: '華信' },
    TTW: { fill: '#ffd43b', name: '虎航' },
    SJX: { fill: '#c7ccd1', name: '星宇' },
    DAC: { fill: '#8a5a3b', name: '德安' },
    UIA: { fill: '#ffffff', ring: '#6f8b83', name: '立榮' },
    APX: { fill: '#ffe066', name: '安捷' },
  };

  function airlineFor(callsign) {
    if (!callsign) return null;
    const prefix = callsign.slice(0, 3).toUpperCase();
    return AIRLINE_COLORS[prefix] || null;
  }

  // ---- Windy 圖層開關 ----
  // 用獨立的 iframe (windy.html) 顯示 Windy 地圖，避免它內部的 Leaflet 1.4.0
  // 跟這頁航機地圖用的 Leaflet 1.9.4 互相衝突。
  // 第一次打開才載入 iframe（lazy load），關閉時只隱藏，不會重複重新載入。
  let windyLoaded = false;

  function toggleWindy() {
    const overlay = document.getElementById('windyOverlay');
    const sw = document.getElementById('windySwitch');
    const isOn = overlay.classList.toggle('active');
    sw.classList.toggle('on', isOn);

    if (isOn && !windyLoaded) {
      document.getElementById('windyFrame').src = 'windy.html';
      windyLoaded = true;
    }
  }
  window.toggleWindy = toggleWindy;

  const map = L.map('map', { zoomControl: true, attributionControl: true })
    .setView([23.6, 120.9], 7);

  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap &copy; CARTO',
    subdomains: 'abcd',
    maxZoom: 19,
  }).addTo(map);

  let markers = {};

  function iconFor(isEmergency, callsign) {
    if (isEmergency) {
      const color = '#ff3b52';
      return L.divIcon({
        className: '',
        html: `<div style="
          width:14px;height:14px;border-radius:50%;
          background:${color};
          box-shadow:0 0 16px ${color};
          animation: blip 1s infinite;
        "></div>
        <style>@keyframes blip{0%,100%{opacity:1}50%{opacity:.35}}</style>`,
        iconSize: [14, 14],
        iconAnchor: [7, 7],
      });
    }
    const airline = airlineFor(callsign);
    const color = airline ? airline.fill : '#33ff99';
    const ringStyle = airline && airline.ring ? `box-shadow:0 0 0 2px ${airline.ring} inset, 0 0 6px ${color};` : `box-shadow:0 0 6px ${color};`;
    return L.divIcon({
      className: '',
      html: `<div style="
        width:9px;height:9px;border-radius:50%;
        background:${color};
        ${ringStyle}
      "></div>`,
      iconSize: [9, 9],
      iconAnchor: [4.5, 4.5],
    });
  }

  function renderAircraft(state) {
    const seen = new Set();
    (state.all_aircraft || []).forEach(a => {
      if (a.latitude == null || a.longitude == null) return;
      const isEmergency = ['7500', '7600', '7700'].includes(a.squawk);
      const airline = airlineFor(a.callsign);
      seen.add(a.icao24);
      const popupHtml = `
        <div style="font-family:'JetBrains Mono',monospace;font-size:12px;">
          <b>${a.callsign || a.icao24}</b> ${airline ? '· ' + airline.name : ''}<br>
          Squawk: ${a.squawk || '—'} ${isEmergency ? '(' + (SQUAWK_MEANING[a.squawk] || '') + ')' : ''}<br>
          Alt: ${a.altitude_m ?? '—'} m &nbsp; Spd: ${a.velocity ?? '—'} m/s<br>
          Origin: ${a.origin_country || '—'}
        </div>`;

      if (markers[a.icao24]) {
        markers[a.icao24].setLatLng([a.latitude, a.longitude]);
        markers[a.icao24].setIcon(iconFor(isEmergency, a.callsign));
        markers[a.icao24].setPopupContent(popupHtml);
      } else {
        markers[a.icao24] = L.marker([a.latitude, a.longitude], { icon: iconFor(isEmergency, a.callsign) })
          .bindPopup(popupHtml)
          .addTo(map);
      }
    });

    Object.keys(markers).forEach(id => {
      if (!seen.has(id)) {
        map.removeLayer(markers[id]);
        delete markers[id];
      }
    });
  }

  function renderAlerts(state) {
    const alerts = Object.values(state.active_alerts || {});
    const listEl = document.getElementById('panelActive');
    const countEl = document.getElementById('alertCount');
    const clusterEl = document.getElementById('alertCluster');
    const tabCountEl = document.getElementById('tabActiveCount');

    countEl.textContent = alerts.length;
    tabCountEl.textContent = `(${alerts.length})`;
    clusterEl.classList.toggle('has-alert', alerts.length > 0);

    if (alerts.length === 0) {
      listEl.innerHTML = `
        <div class="empty-state">
          <span class="glyph">◎</span>
          目前空域內無緊急代碼事件。<br>
          偵測到 squawk 7500 / 7600 / 7700 時會即時顯示於此，並透過 Telegram 推播。
        </div>`;
      return;
    }

    listEl.innerHTML = alerts.map(a => `
      <div class="alert-card">
        <div class="callsign">${a.callsign || a.icao24}</div>
        <span class="code">SQUAWK ${a.squawk} · ${SQUAWK_MEANING[a.squawk] || ''}</span>
        <div class="meta">
          位置: ${a.latitude?.toFixed(3)}, ${a.longitude?.toFixed(3)}<br>
          高度: ${a.altitude_m ?? '—'} m &nbsp;|&nbsp; 國籍: ${a.origin_country || '—'}
        </div>
      </div>
    `).join('');
  }

  // ---- 歷史紀錄「刪除」是本機隱藏，不是真的改動 GitHub 上的 state.json ----
  // (dashboard 是純前端靜態頁面，沒有寫入 repo 的權限，也不該把有寫入權限的
  //  GitHub token 放進公開網頁裡，所以用瀏覽器 localStorage 記住「不想看的項目」)
  const HIDDEN_KEY = 'squawk_hidden_history';

  function getHiddenSet() {
    try {
      return new Set(JSON.parse(localStorage.getItem(HIDDEN_KEY) || '[]'));
    } catch {
      return new Set();
    }
  }

  function hideHistoryItem(id) {
    const hidden = getHiddenSet();
    hidden.add(id);
    localStorage.setItem(HIDDEN_KEY, JSON.stringify([...hidden]));
    refresh();
  }
  window.hideHistoryItem = hideHistoryItem;

  function historyItemId(a) {
    return `${a.icao24}_${a.detected_at}`;
  }

  function renderHistory(state) {
    const hidden = getHiddenSet();
    const history = (state.history || [])
      .filter(a => !hidden.has(historyItemId(a)))
      .slice()
      .reverse(); // 新的在上面
    const listEl = document.getElementById('panelHistory');
    const tabCountEl = document.getElementById('tabHistoryCount');

    tabCountEl.textContent = `(${history.length})`;

    if (history.length === 0) {
      listEl.innerHTML = `
        <div class="empty-state">
          <span class="glyph">◎</span>
          自系統啟動以來，尚無緊急代碼歷史紀錄。
        </div>`;
      return;
    }

    listEl.innerHTML = history.map(a => {
      const t = a.detected_at ? new Date(a.detected_at).toLocaleString('zh-TW', { hour12: false }) : '—';
      const id = historyItemId(a);
      return `
        <div class="history-card">
          <button class="delete-btn" onclick="hideHistoryItem('${id}')" title="從清單中移除（僅本機隱藏）">✕</button>
          <div class="callsign">${a.callsign || a.icao24}</div>
          <span class="code">SQUAWK ${a.squawk} · ${SQUAWK_MEANING[a.squawk] || ''}</span>
          <div class="meta">
            偵測時間: ${t}<br>
            位置: ${a.latitude?.toFixed?.(3) ?? '—'}, ${a.longitude?.toFixed?.(3) ?? '—'} &nbsp;|&nbsp; 國籍: ${a.origin_country || '—'}
          </div>
        </div>`;
    }).join('');
  }

  function switchTab(tab) {
    document.getElementById('tabActive').classList.toggle('active', tab === 'active');
    document.getElementById('tabHistory').classList.toggle('active', tab === 'history');
    document.getElementById('panelActive').classList.toggle('active', tab === 'active');
    document.getElementById('panelHistory').classList.toggle('active', tab === 'history');
  }
  window.switchTab = switchTab;

  async function refresh() {
    try {
      const res = await fetch(STATE_URL, { cache: 'no-store' });
      if (!res.ok) throw new Error('state.json 讀取失敗: ' + res.status);
      const state = await res.json();

      document.getElementById('aircraftCount').textContent = (state.all_aircraft || []).length;
      if (state.last_update) {
        document.getElementById('lastUpdate').textContent =
          new Date(state.last_update).toLocaleTimeString('zh-TW', { hour12: false });
      }

      renderAircraft(state);
      renderAlerts(state);
      renderHistory(state);
    } catch (err) {
      console.error(err);
      document.getElementById('lastUpdate').textContent = '讀取失敗';
    }
  }

  function forceRefresh() {
    const btn = document.getElementById('refreshBtn');
    btn.classList.add('spinning');
    btn.disabled = true;
    refresh().finally(() => {
      setTimeout(() => {
        btn.classList.remove('spinning');
        btn.disabled = false;
      }, 400);
    });
  }
  window.forceRefresh = forceRefresh;

  refresh();
  setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
